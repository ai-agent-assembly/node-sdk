name: publish-docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/publish-docs.yml"
  push:
    branches:
      - master
  workflow_dispatch:

# Default to read-only. Only the deploy job (push to master) needs write to
# push the built site to the gh-pages branch; the build job — which also runs
# on pull_request — stays read-only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Docusaurus derives each page's "Last updated" date + author from
          # `git log` for the file (showLastUpdateTime/Author in
          # docusaurus.config.ts). A shallow clone has no per-file history, so
          # fetch the full history.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install SDK dependencies
        run: pnpm install --frozen-lockfile

      - name: Check docs metadata is not stale
        # AAASM-4312: regenerate the bounded docs metadata blocks and fail if
        # anything changed. Keeps README/docs install-command and version-pin
        # snippets in lock-step with package.json + metadata/sdk.json.
        run: |
          pnpm run generate:docs-metadata
          git diff --exit-code -- README.md docs

      - name: Install website dependencies
        # `--ignore-workspace` tells pnpm to skip the parent
        # `pnpm-workspace.yaml` (added under AAASM-1220) when installing
        # in `website/`. Without this flag, pnpm 10 inherits the parent
        # workspace context, sees website/ isn't a listed workspace
        # member, and produces no website/node_modules — so the
        # follow-up `pnpm build` then fails with `docusaurus: not found`.
        # See AAASM-1221 / PR #43 CI diagnosis.
        run: pnpm install --no-frozen-lockfile --ignore-workspace
        working-directory: website

      - name: Build Docusaurus site
        run: pnpm build
        working-directory: website

      - name: Upload built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docusaurus-site
          path: ./website/build
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Write is scoped to this push-only deploy job; peaceiris pushes the built
    # site to the gh-pages branch via GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - name: Download built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docusaurus-site
          path: ./website/build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "docs: deploy Docusaurus site to gh-pages"
