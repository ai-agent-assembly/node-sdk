name: publish-docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      # AAASM-4919: README carries generated version blocks (install snippets,
      # release-line prose). A README-only edit that stales a generated block
      # must retrigger the drift check, so it is a trigger path in its own right
      # — the check already diffs README.md, it just was not firing on it.
      - "README.md"
      - ".github/workflows/publish-docs.yml"
      # AAASM-4327: shared-metadata drift now also affects runtime source
      # under src/generated/, so any change there must retrigger the drift
      # check even when docs/ and website/ are untouched.
      - "src/generated/**"
      - "metadata/**"
      - "scripts/generate-docs-metadata.mjs"
      # AAASM-5676 / AAASM-5689: the retraction map generator/registry, and its
      # generated output — same drift-retrigger reasoning as the block above.
      - "website/retractions.json"
      - "scripts/generate-retraction-map.mjs"
      - "website/src/generated/**"
      # AAASM-5529: the claim-binding gate below reads the control files and the
      # deny path. Without these, a PR that only WEAKENS the gate — renaming a
      # control, or changing which error the deny throws — would not re-run it.
      - "tests/**"
      - "src/gateway/**"
      - "src/wrappers/**"
  push:
    branches:
      - main
  workflow_dispatch:

# Default to read-only. Only the deploy job (push to main) needs write to
# push the built site to the gh-pages branch; the build job — which also runs
# on pull_request — stays read-only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Docusaurus derives each page's "Last updated" date + author from
          # `git log` for the file (showLastUpdateTime/Author in
          # docusaurus.config.ts). A shallow clone has no per-file history, so
          # fetch the full history.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install SDK dependencies
        run: pnpm install --frozen-lockfile

      - name: Check docs metadata is not stale
        # AAASM-4312: regenerate the bounded docs metadata blocks and fail if
        # anything changed. Keeps README/docs install-command and version-pin
        # snippets in lock-step with package.json + metadata/sdk.json.
        # AAASM-4327: the same generator also emits src/generated/install-hints.ts
        # for runtime error strings, so the drift check now covers that path.
        # AAASM-4514: the generator also rewrites the quickstart-framework-tabs
        # block in docs/02-quick-start/index.md from the vendored snippet
        # manifest under metadata/quickstart-snippets/, so an edited snippet or a
        # hand-tweaked tab block that was not regenerated fails here (docs is
        # already in the diff scope; metadata/** is already a trigger path).
        run: |
          pnpm run generate:docs-metadata
          git diff --exit-code -- README.md docs src/generated

      # AAASM-5529. The step above round-trips the quickstart tab block as TEXT:
      # it proves docs match the vendored snippets under metadata/ and nothing
      # more. The snippets are never executed or linted in CI — they are excluded
      # from ESLint (eslint.config.mjs) and Prettier (.prettierignore), and they
      # import "./policy.js", a file the reader supplies. The base tsconfig.json
      # does include them, but no CI job type-checks with it (pnpm typecheck runs
      # tsconfig.test.json), so nothing gates them.
      #
      # This step gates a different surface: the prose in §2, §3 and §4, where
      # the quick-start states what governance does. Each claim is bound to the
      # control that proves it.
      #
      # It runs HERE because test-matrix.yml sets paths-ignore on docs/** and
      # **/*.md, so a docs-only PR — precisely the change that rewords a claim —
      # runs no tests at all.
      #
      # SCOPE OF ENFORCEMENT, so nobody reads this as more than it is: this
      # workflow is NOT one of the workflows ci-success.yml aggregates, and
      # branch protection on main currently declares no required status checks
      # at all. This step therefore makes the drift VISIBLE on the PR; it does
      # not by itself block a merge. Closing that gap is AAASM-5677's scope.
      - name: Every documented enforcement claim names the control that proves it
        run: pnpm exec vitest run tests/quickstart-claim-bindings.test.ts

      # AAASM-5676 / AAASM-5689. Regenerates website/src/generated/retraction-map.ts
      # from website/retractions.json against every frozen version snapshot plus
      # `current`, and fails if the committed map has drifted — the same shape as
      # the docs-metadata check above. This is what "a retracted claim on a
      # default-served page cannot silently recur" means mechanically: a page
      # newly matching a registered pattern, in any version, changes the
      # generated output, so a stale committed map (one that doesn't yet know
      # about it) fails here.
      - name: Check the retraction map is not stale
        run: |
          pnpm run generate:retraction-map
          git diff --exit-code -- website/src/generated/retraction-map.ts

      - name: Install website dependencies
        # `--ignore-workspace` tells pnpm to skip the parent
        # `pnpm-workspace.yaml` (added under AAASM-1220) when installing
        # in `website/`. Without this flag, pnpm 10 inherits the parent
        # workspace context, sees website/ isn't a listed workspace
        # member, and produces no website/node_modules — so the
        # follow-up `pnpm build` then fails with `docusaurus: not found`.
        # See AAASM-1221 / PR #43 CI diagnosis.
        run: pnpm install --no-frozen-lockfile --ignore-workspace
        working-directory: website

      - name: Build Docusaurus site
        run: pnpm build
        working-directory: website

      - name: Upload built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docusaurus-site
          path: ./website/build
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Write is scoped to this push-only deploy job; peaceiris pushes the built
    # site to the gh-pages branch via GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - name: Download built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docusaurus-site
          path: ./website/build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "docs: deploy Docusaurus site to gh-pages"
