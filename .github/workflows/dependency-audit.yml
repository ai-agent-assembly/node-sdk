name: dependency-audit

# Advisory gate for the npm dependency tree (AAASM-3616, Story AAASM-3568).
#
# Fails CI when a dependency carries a known advisory at >= high severity, so a
# poisoned transitive dep cannot ride into an npm publish via the lockfile. This
# is the node-sdk counterpart to go-sdk's govulncheck gate and python-sdk's
# pip-audit gate — the three SDK ecosystems are now uniformly advisory-gated.
#
# Allowlist for unfixable advisories
# ----------------------------------
# `pnpm audit` reads an allowlist from the root package.json under
# `pnpm.auditConfig.ignoreGhsas` (and/or `ignoreCves`). Mirror go-sdk's
# `KNOWN_UNFIXED` convention: only add an advisory there when NO fixed version
# exists yet, with a dated comment recording why and what we are waiting on.
# Start with none ignored. Example:
#
#   "pnpm": {
#     "auditConfig": {
#       "ignoreGhsas": [
#         "GHSA-xxxx-xxxx-xxxx"  // 2026-06-23: no fix released; awaiting upstream <ver>
#       ]
#     }
#   }
#
# Triggers mirror test-matrix.yml so the gate runs on the same code-bearing
# PRs/pushes and the ci-success.yml aggregate gate can wait on it by name.
#
# pnpm pin (AAASM-4594)
# ----------------------
# `pnpm audit` needs pnpm 11+ to reach npm's replacement bulk advisory
# endpoint — npm retired the legacy audit endpoints it called on 10.x (HTTP
# 410 as of 2026-07-15). This is intentionally scoped to this job alone, not
# a repo-wide bump (every other workflow keeps the 10.33.2 pin): pnpm 11
# requires explicit allowlisting of postinstall/build scripts (this repo has
# none configured) and silently stops honoring `package.json`'s
# `pnpm.overrides` field, both of which need a dedicated, separately-tested
# migration.
#
# `pnpm audit` only reads the already-resolved versions in pnpm-lock.yaml —
# it needs no installed node_modules tree — so this job skips `pnpm install`
# entirely and invokes pnpm 11 ad hoc via corepack, rather than through
# `pnpm/action-setup` or a real `pnpm install`. That sidesteps two pnpm-11
# frictions that would otherwise block just this job: (a) `pnpm/action-setup`
# hard-errors when its `version:` input disagrees with package.json's
# `packageManager` field (pinned at 10.33.2 for the rest of the repo), and
# (b) a `--frozen-lockfile install` under pnpm 11 flags the no-longer-read
# `pnpm.overrides` field as a config mismatch against the lockfile.
# `--pm-on-fail=ignore` bypasses pnpm's own packageManager version guard for
# this one ad hoc invocation, without touching package.json or corepack's
# global activation state.

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      # Non-zero exit (an advisory at >= high that is not in the
      # pnpm.auditConfig allowlist) fails the job and blocks the release path.
      - name: Audit dependencies for known advisories
        run: corepack pnpm@11.13.0 --pm-on-fail=ignore audit --audit-level=high
