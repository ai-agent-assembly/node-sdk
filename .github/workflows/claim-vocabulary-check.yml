name: Claim Vocabulary Check

# AAASM-5798 / AAASM-5599: ADR 0033's banned-absolute and undifferentiated-verb
# rules against this repo's reader-facing Markdown (README, CONTRIBUTING,
# SECURITY, docs/**). Ported from agent-assembly's check_claim_vocabulary.py
# (AAASM-5679), via docs Hub's (AAASM-5797) and python-sdk's (AAASM-5798)
# ports. Per AAASM-5795's federation-by-convention decision this repo's copy
# is independent -- see scripts/check_claim_vocabulary.py's own docstring.
# The checker stays Python; this repo is TypeScript, but AAASM-5795 already
# concluded Node/Go repos shell out to a Python process either way, so this
# workflow just installs Python 3.12 to run it.
#
# precommit.yml's own path-ignore excludes "**/*.md" and "docs/**" entirely,
# so a docs-only PR otherwise gets no CI at all here.
#
# Full-tree, not diff-scoped: the tree's blocking baseline is zero as of this
# same PR (two real findings fixed alongside the port).

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - "scripts/check_claim_vocabulary.py"
      - ".github/workflows/claim-vocabulary-check.yml"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claim-vocabulary:
    name: Check for banned-absolute and undifferentiated-verb claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the claim-vocabulary self-test
        run: python3 scripts/check_claim_vocabulary.py --selftest

      - name: Scan for banned-absolute and undifferentiated-verb claims
        run: python3 scripts/check_claim_vocabulary.py --root .
