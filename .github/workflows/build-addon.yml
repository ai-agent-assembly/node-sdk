name: build-addon

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  napi-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The napi addon embeds aa-sdk-client, whose aa-runtime IPC transport
        # is Unix-domain sockets (tokio UnixStream/UnixListener, cfg(unix)). It
        # does not build on Windows, and the SDK ships no Windows native runtime
        # (see optionalDependencies); Windows consumers use grpc-sidecar mode.
        # Per-PR builds are ubuntu-only (fast public-minute feedback);
        # macOS is added on push:master and tags, where the prebuilt
        # release artifacts are actually consumed (AAASM-2664).
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Setup protoc
        # The Node binding now depends (transitively, via aa-sdk-client) on
        # aa-proto, whose build script compiles .proto sources with protoc.
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # On PRs, a fast debug build is enough to prove the addon compiles
      # and the napi bindings load. Release builds (optimised, --platform
      # suffixed prebuilds) run only on push:master / tags (AAASM-2664).
      - name: Build napi addon (debug, PR)
        if: github.event_name == 'pull_request'
        run: pnpm native:build

      - name: Build napi addon (release, push/tag)
        if: github.event_name != 'pull_request'
        run: pnpm native:build:release

      - name: Run native integration acceptance
        run: pnpm vitest run tests/native-napi-integration.test.ts
        env:
          AA_NATIVE_TEST: "1"

      - name: Upload prebuilt artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent_assembly-${{ matrix.os }}-node${{ matrix.node-version }}
          path: native/aa-ffi-node/*.node
