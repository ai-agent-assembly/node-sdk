name: build-addon

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # AAASM-6182. The napi-build job below proves the cdylib COMPILES and that
  # Node can load it; it runs no Rust unit test, because `aa-ffi-node`'s own test
  # harness cannot link — the `napi_*` C symbols come from the Node host process
  # at addon load time, and a `cargo test` binary has no host. So the binding's
  # Rust-side logic (the typed error codes, the JS<->proto translation, and the
  # query_policy fail-open contract) had no executing test at all.
  #
  # That logic now lives in `aa-ffi-node-core`, a plain rlib with no napi
  # dependency, and this job runs its tests. It deliberately does NOT reuse the
  # matrix below: no Node and no pnpm are involved, and the result is
  # platform-independent, so one ubuntu runner is the whole cost.
  #
  # This job is part of build-addon, which ci-success.yml aggregates, so a
  # failure here is visible on the same required rollup as the build itself.
  native-core-tests:
    name: Host-independent binding tests (cargo test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Setup protoc
        # aa-ffi-node-core depends on aa-proto, whose build script compiles
        # .proto sources with protoc.
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # `--locked` so a test run can never silently resolve a different
      # agent-assembly checkout than the committed Cargo.lock names: the ADR
      # 0003 lockstep pin is what makes these assertions about the shared
      # client's error variants meaningful.
      - name: Run the host-independent binding tests
        run: cargo test -p aa-ffi-node-core --locked
        working-directory: native/aa-ffi-node

  napi-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The napi addon embeds aa-sdk-client, whose aa-runtime IPC transport
        # is Unix-domain sockets (tokio UnixStream/UnixListener, cfg(unix)). It
        # does not build on Windows, and the SDK ships no Windows native runtime
        # (see optionalDependencies); Windows consumers use grpc-sidecar mode.
        # Per-PR builds are ubuntu-only (fast public-minute feedback);
        # macOS is added on push:main and tags, where the prebuilt
        # release artifacts are actually consumed (AAASM-2664).
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Setup protoc
        # The Node binding now depends (transitively, via aa-sdk-client) on
        # aa-proto, whose build script compiles .proto sources with protoc.
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On PRs, a fast debug build is enough to prove the addon compiles
      # and the napi bindings load. Release builds (optimised, --platform
      # suffixed prebuilds) run only on push:main / tags (AAASM-2664).
      - name: Build napi addon (debug, PR)
        if: github.event_name == 'pull_request'
        run: pnpm native:build

      - name: Build napi addon (release, push/tag)
        if: github.event_name != 'pull_request'
        run: pnpm native:build:release

      - name: Run native integration acceptance
        run: pnpm vitest run tests/native-napi-integration.test.ts
        env:
          AA_NATIVE_TEST: "1"
          # Repo-root CWD is a "non-standard install layout" as far as the loader
          # is concerned. Opt in to the CWD fallback so it probes
          # <cwd>/native/aa-ffi-node/index.cjs (built by the previous step)
          # in addition to the two relative-path candidates. See AAASM-4302.
          AA_ALLOW_CWD_NATIVE_FALLBACK: "1"

      - name: Upload prebuilt artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent_assembly-${{ matrix.os }}-node${{ matrix.node-version }}
          path: native/aa-ffi-node/*.node
