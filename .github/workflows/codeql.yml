name: CodeQL

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode: none -- CodeQL extracts source directly without a full
          # workspace build, keeping each analysis cheap on the free standard
          # hosted runners.
          - language: javascript-typescript
            build-mode: none
          # The repo's own GitHub Actions workflows. Never analysed before
          # AAASM-6120 -- enabling this language on the sibling `horonomy` org
          # immediately surfaced 11 real medium-severity findings.
          - language: actions
            build-mode: none
          # 95,910 bytes of first-party Python: the repo's own metadata /
          # docs-vocabulary drift checkers under `scripts/` (which CI executes)
          # and the credential-operations + repo-scaffold skill helpers under
          # `.claude/skills/`. Unanalysed until AAASM-6120.
          - language: python
            build-mode: none
          # 19,893 bytes of first-party Rust: the `native/aa-ffi-node` napi-rs
          # shim (`src/lib.rs` + `build.rs`) that bridges Node to the shared
          # aa-sdk-client runtime client. `rust` cannot be enabled through
          # CodeQL *default* setup (PATCH code-scanning/default-setup rejects it
          # with HTTP 422) -- advanced setup with `build-mode: none` is the only
          # route, and is the same configuration already proven on the horonomy
          # Rust repos (eltanin, libra-governor, fornax-core).
          - language: rust
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@65216971a11ded447a6b76263d5a144519e5eee1 # codeql-bundle-v2.25.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@65216971a11ded447a6b76263d5a144519e5eee1 # codeql-bundle-v2.25.2
        with:
          category: "/language:${{ matrix.language }}"
