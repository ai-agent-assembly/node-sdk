name: Contact Metadata Drift Check

# AAASM-5756: the security-contact region in SECURITY.md is owned by the
# canonical org metadata registry in ai-agent-assembly/.github (ADR 0014 /
# AAASM-5519). scripts/check_contact_metadata.py syncs/audits it against the
# pinned canonical facts. This gate fails closed if it drifts, so a stale
# contact literal can never merge — the negative control step proves the
# gate itself actually turns red instead of always passing.
#
# Ported from python-sdk's .github/workflows/contact-metadata-check.yml
# (AAASM-5520), matching this repo's claim-vocabulary-check.yml shape
# (pinned actions/setup-python, python3.12) since this repo is TypeScript
# but the checker stays Python per AAASM-5795's federation-by-convention
# decision. Not added to ci-success.yml's workflow_run aggregator, matching
# claim-vocabulary-check.yml's own precedent of staying outside it.

on:
  pull_request:
    paths:
      - "SECURITY.md"
      - "scripts/check_contact_metadata.py"
      - "scripts/check_contact_metadata_negative_control.sh"
      - ".github/workflows/contact-metadata-check.yml"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contact-drift:
    name: contact metadata drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the negative control (proves the gate can actually fail)
        run: bash scripts/check_contact_metadata_negative_control.sh

      - name: Audit contact literals against the pinned registry
        run: python3 scripts/check_contact_metadata.py --check
