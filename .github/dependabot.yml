version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/website"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "node-sdk"

  # Rust native binding (napi-rs) — native/aa-ffi-node
  - package-ecosystem: "cargo"
    directory: "/native/aa-ffi-node"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
