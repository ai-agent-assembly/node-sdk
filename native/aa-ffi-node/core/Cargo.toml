[package]
name = "aa-ffi-node-core"
version = "0.0.0"
edition = "2021"
description = "Host-independent core of the Agent Assembly Node binding (no napi dependency)"
license = "Apache-2.0"

# Default (rlib) crate-type, deliberately. The sibling `aa-ffi-node` crate is a
# cdylib whose `napi_*` C symbols are supplied by the Node host process at addon
# load time, so its `cargo test` harness — a standalone executable with no Node
# host — cannot link (AAASM-6182). Everything here is plain Rust with no napi
# dependency, so `cargo test -p aa-ffi-node-core` links and runs anywhere.
[dependencies]
aa-sdk-client = { workspace = true }
aa-proto = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The mock `aa-runtime` Unix-domain-socket server encodes a CheckActionResponse
# over the shared wire codec, so the tests need prost plus the async net/io stack.
prost = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
# The mock server performs the AAASM-3587 session handshake (the client signs
# `nonce || sdk_version` before any heartbeat), so the test verifies the Ed25519
# proof. `rand` is value-returning for the nonce (no `[0u8; N]` literal in the
# signing data-flow → CodeQL-clean).
ed25519-dalek = "3"
sha2 = "0.11"
hex = "0.4"
rand = "0.10"
