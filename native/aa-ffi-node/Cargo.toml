[package]
name = "aa-ffi-node"
version = "0.0.0"
edition = "2021"
description = "Thin napi-rs shim over aa-sdk-client for the Agent Assembly Node SDK"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Shared, FFI-agnostic SDK runtime-client: UDS transport, IPC wire codec,
# AssemblyClient lifecycle, and advisory (non-authoritative) preflight. Pinned
# by git SHA, mirroring the python-sdk precedent (which pins aa-core/aa-proto by
# `rev`); advisory preflight arrives transitively via its default `preflight`
# feature. AAASM-2559 will formalize a published/pinned distribution + a
# standalone-build CI smoke check on the agent-assembly side.
#
# `aa-proto` is pinned at the SAME SHA so cargo resolves a single checkout of
# the agent-assembly workspace; `query_policy` builds a `CheckActionRequest`
# and reads its `CheckActionResponse` directly from these generated types.
#
# Pinned at agent-assembly master 9cde1d83 (AAASM-3396), which adds
# `AssemblyClient::register()` (the one direct SDK→gateway gRPC call, per ADR
# 0004) and makes `query_policy()` attach the registration `credential_token`
# so the gateway does not deny a registered agent. That commit also adds the
# `gateway_endpoint` field to `AssemblyConfig`, consumed by `register`.
aa-sdk-client = { git = "https://github.com/ai-agent-assembly/agent-assembly.git", rev = "9cde1d83e4114114bd49c9546d4fa5d86d6cbd32", package = "aa-sdk-client" }
aa-proto = { git = "https://github.com/ai-agent-assembly/agent-assembly.git", rev = "9cde1d83e4114114bd49c9546d4fa5d86d6cbd32", package = "aa-proto" }
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt", "serde-json"] }
napi-derive = "3"
prost = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
# A Rust integration test drives `query_policy` against a mock `aa-runtime`
# Unix-domain-socket server that answers `PolicyQuery` over the shared wire
# codec, so it needs the async net/io stack and prost to encode the response.
prost = "0.14"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
