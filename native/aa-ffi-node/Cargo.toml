# AAASM-6182: this manifest is both the `aa-ffi-node` package and the workspace
# root for it plus `core/` (`aa-ffi-node-core`).
#
# Why the split: `aa-ffi-node` is a cdylib whose `napi_*` C symbols are supplied
# by the Node host process at addon load time. A `cargo test` harness is a
# standalone executable with no Node host, so those symbols are undefined at link
# time and the `lib test` target cannot link — which made three tests pinning the
# runtime-Deny mapping and the no-runtime fail-open path unrunnable on any
# machine. All of that logic now lives in `core/`, a plain rlib with no napi
# dependency, where `cargo test -p aa-ffi-node-core` links and runs everywhere.
#
# The workspace root stays HERE rather than at native/ so Cargo.lock stays at
# native/aa-ffi-node/Cargo.lock: that is the path Dependabot's cargo ecosystem
# is pointed at (.github/dependabot.yml) and the path `napi build
# --manifest-path` uses.
[workspace]
members = [".", "core"]

# The agent-assembly git pins live here, in ONE place, and both packages consume
# them with `{ workspace = true }`. That is what keeps the ADR 0003 lockstep
# invariant enforceable by .github/workflows/native-pin-consistency.yml, which
# greps this file for distinct revs: adding a second crate could otherwise have
# introduced a second place for the revs to skew.
#
# Shared, FFI-agnostic SDK runtime-client: UDS transport, IPC wire codec,
# AssemblyClient lifecycle, and advisory (non-authoritative) preflight. Pinned
# by git SHA, mirroring the python-sdk precedent (which pins aa-core/aa-proto by
# `rev`); advisory preflight arrives transitively via its default `preflight`
# feature. AAASM-2559 will formalize a published/pinned distribution + a
# standalone-build CI smoke check on the agent-assembly side.
#
# `aa-proto` is pinned at the SAME SHA so cargo resolves a single checkout of
# the agent-assembly workspace; `query_policy` builds a `CheckActionRequest`
# and reads its `CheckActionResponse` directly from these generated types.
#
# Pinned at agent-assembly AAASM-3683, which adds the `sdk_version` field to
# `AssemblyConfig` and threads it through `spawn_ipc_thread` into the signed IPC
# handshake — the version this shim forwards from the npm package version so
# downgrade detection reflects the installed @agent-assembly/sdk release.
# Re-pin to the squash-merge commit once PR #1226 lands on master. (Prior pin
# ebc4d7dc / AAASM-3415 added `team_id` / `parent_agent_id`, still forwarded.)
[workspace.dependencies]
aa-sdk-client = { git = "https://github.com/ai-agent-assembly/agent-assembly.git", rev = "0044d515d020863767d8011e18e266ec37344e5c", package = "aa-sdk-client" }
aa-proto = { git = "https://github.com/ai-agent-assembly/agent-assembly.git", rev = "0044d515d020863767d8011e18e266ec37344e5c", package = "aa-proto" }
prost = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[package]
name = "aa-ffi-node"
version = "0.0.0"
edition = "2021"
description = "Thin napi-rs shim over aa-sdk-client for the Agent Assembly Node SDK"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# All non-napi logic — the typed error-code vocabulary, the JS<->proto
# translation, and the query_policy fail-open contract — lives here, in a crate
# with no napi dependency so it is unit-testable without a Node host.
aa-ffi-node-core = { path = "core" }
aa-sdk-client = { workspace = true }
aa-proto = { workspace = true }
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt", "serde-json"] }
napi-derive = "3"
prost = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[build-dependencies]
napi-build = "2"

# Deliberately NO [dev-dependencies]: this package's `lib test` target cannot
# link (see the header), so any test here would be dead weight. The unit tests
# and their dev-dependencies live in core/ (AAASM-6182).
