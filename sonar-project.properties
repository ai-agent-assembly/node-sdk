sonar.host.url=https://sonarcloud.io
sonar.projectKey=ai-agent-assembly_node-sdk
sonar.organization=ai-agent-assembly

sonar.projectName=node-sdk
# Static fallback only. The CI scan (.github/workflows/quality-report.yml)
# overrides this with -Dsonar.projectVersion=<package.json version> so the
# SonarCloud quality gate auto-advances each release. Keep this off 0.0.0 (which
# stalls the gate at "Not computed") and roughly in step with package.json.
sonar.projectVersion=0.0.1-rc.2

sonar.projectBaseDir=./
sonar.sources=src/
sonar.tests=tests/
sonar.test.inclusions=tests/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
# src/proto/generated/* is protoc-gen-ts_proto output (marked "DO NOT EDIT").
# Generated serialization codecs are exercised transitively, not unit-tested;
# excluding generated code from the coverage metric is standard practice.
sonar.coverage.exclusions=src/proto/generated/**
# Exclude the same generated code from issue analysis: its blanket
# `/* eslint-disable */` header and machine-emitted style are regenerated by
# scripts/gen-proto.mjs, so source-level smells there are not actionable.
sonar.exclusions=src/proto/generated/**
sonar.sourceEncoding=UTF-8
