# pnpm workspace — declares the root @agent-assembly/sdk package plus the
# per-platform @agent-assembly/runtime-* runtime binary sub-packages added
# under AAASM-1203 / AAASM-1220. The runtime sub-packages each ship a single
# `aasm` binary built for a specific (os, cpu) pair; pnpm/npm install only
# the sub-package matching the host platform via os/cpu constraints in their
# individual package.json files.
packages:
  - "."
  - "packages/*"

# Security version floors. These live here rather than in package.json's
# `pnpm.overrides` field because pnpm 11 ignores that field entirely (root cause
# established in AAASM-5876 / HORO-377): on the day a pnpm@11 bump lands, floors
# left in package.json stop applying silently - no error, no failing check - and
# the next relock resolves the transitives back down, reopening the advisories
# they close. pnpm 10 reads `overrides` from this file too, so this location is
# correct for both majors.
overrides:
  # GHSA-hrr3-gc8f-f4qj. Vulnerable range is `>= 3.0.0, < 3.1.8`, so the
  # previous ^3.1.6 floor was stale by two patches and the advisory fired
  # against a floor that already existed. fast-uri reaches us through
  # ajv@8.20.0, which declares `fast-uri: ^3.0.1` - an ordinary range, not a
  # pin - so 3.1.8 is a semver-compatible resolution and this is a plain floor
  # raise. Deliberately kept inside 3.x: fast-uri 4.x is published, but ^3.0.1
  # does not admit it, so a 4.x floor here would force a resolution the
  # dependent never declared.
  fast-uri: ^3.1.8
  esbuild: '>=0.28.1'
  protobufjs: ^7.6.1
  ws: '>=8.21.0'
  vite: ^6.4.3
  hono: ^4.13.5
  '@hono/node-server': ^2.0.11
  # Four advisories at two fix levels: GHSA-2vr4-cq9g-pvrc and
  # GHSA-rpw4-54j3-4h4q are fixed in 10.5.1, GHSA-h3mg-xc3c-68pw and
  # GHSA-j6r3-76f7-8jcv in 10.7.1. ^10.7.1 is the single floor that clears all
  # four; the previous ^10.3.1 resolved 10.4.0, inside every one of the four
  # vulnerable ranges.
  #
  # Unlike fast-uri above, this entry overrides an upstream EXACT pin:
  # express-rate-limit@8.4.1 declares `ip-address: 10.1.0`, not a range. The
  # lockfile's pre-existing 10.4.0 is therefore not evidence that the pin
  # admits newer versions - it is evidence that this override was already
  # overriding it. No semver-compatible resolution exists for Dependabot to
  # propose, which is why four open alerts had no pull request.
  #
  # Removal condition: drop this entry once an express-rate-limit release
  # declares ip-address >= 10.7.1 (as a range or as a newer exact pin).
  ip-address: ^10.7.1
  qs: ^6.16.0
  tar: ^7.5.21
  uuid: '>=11.1.1'
  '@langchain/core': ^1.2.1
  body-parser@2: ^2.3.0
  postcss: ^8.5.18
  brace-expansion: ^5.0.9
