# pnpm workspace — declares the root @agent-assembly/sdk package plus the
# per-platform @agent-assembly/runtime-* runtime binary sub-packages added
# under AAASM-1203 / AAASM-1220. The runtime sub-packages each ship a single
# `aasm` binary built for a specific (os, cpu) pair; pnpm/npm install only
# the sub-package matching the host platform via os/cpu constraints in their
# individual package.json files.
packages:
  - "."
  - "packages/*"

# Security version floors. These live here rather than in package.json's
# `pnpm.overrides` field because pnpm 11 ignores that field entirely (root cause
# established in AAASM-5876 / HORO-377): on the day a pnpm@11 bump lands, floors
# left in package.json stop applying silently - no error, no failing check - and
# the next relock resolves the transitives back down, reopening the advisories
# they close. pnpm 10 reads `overrides` from this file too, so this location is
# correct for both majors.
overrides:
  fast-uri: ^3.1.6
  esbuild: '>=0.28.1'
  protobufjs: ^7.6.1
  ws: '>=8.21.0'
  vite: ^6.4.3
  hono: ^4.13.5
  '@hono/node-server': ^2.0.11
  ip-address: ^10.3.1
  qs: ^6.16.0
  tar: ^7.5.21
  uuid: '>=11.1.1'
  '@langchain/core': ^1.2.1
  body-parser@2: ^2.3.0
  postcss: ^8.5.18
  brace-expansion: ^5.0.9
