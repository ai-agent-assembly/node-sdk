# This file exists solely to make `website/` an explicit pnpm workspace root and
# to hold its security version floors.
#
# Why the floors are not in website/package.json's `pnpm.overrides`: pnpm 11
# ignores that field entirely (root cause established in AAASM-5876 / HORO-377).
# Left there, all of the floors below would stop applying the day a pnpm@11 bump
# lands - silently, exit 0, no warning - and the next relock would resolve the
# transitives back down, reopening the advisories they close. Several of these are
# RCE- or DoS-class (serialize-javascript, http-proxy-middleware,
# webpack-dev-server, dompurify, ws, nanoid, js-yaml).
#
# Why `packages:` is absent: website/ is a standalone project with its own
# pnpm-lock.yaml and is deliberately NOT a member of the repository-root
# workspace (that root lists only "." and "packages/*"). With this file present,
# pnpm run inside website/ stops walking up to the root pnpm-workspace.yaml, which
# is what `--ignore-workspace` used to be needed for in publish-docs.yml - see
# AAASM-1221 / PR #43. That flag has been removed there, because
# `--ignore-workspace` makes pnpm skip THIS file too, which would drop every
# floor below.
overrides:
  shell-quote: ^1.9.0
  '@babel/plugin-transform-modules-systemjs': ^7.29.4
  # GHSA-hrr3-gc8f-f4qj, vulnerable `>= 3.0.0, < 3.1.8`: the ^3.1.6 floor was
  # stale by two patches. Arrives via ajv@8.20.0, which declares
  # `fast-uri: ^3.0.1`, so 3.1.8 is a semver-compatible resolution. Kept inside
  # 3.x on purpose - fast-uri 4.x is published but ^3.0.1 does not admit it.
  fast-uri: ^3.1.8
  http-proxy-middleware: ^3.0.6
  serialize-javascript: '>=7.0.3'
  ws: '>=8.21.0'
  # Six advisories at one fix level (7.29.1): GHSA-w293-vg96-wgc3 (high),
  # GHSA-2jfj-6hjv-fm6j, GHSA-pmjh-fq2x-6v4x, GHSA-8436-99hf-9mmv,
  # GHSA-2gqq-gqf2-x968, GHSA-r53p-7pc4-xj5r. The ^7.29.0 floor was stale by a
  # single patch, so all six fired against a floor that already existed.
  # Arrives via cheerio@1.2.0, which declares `undici: ^7.19.0` - a range, so
  # this is an ordinary floor raise. Kept inside 7.x: undici 8.x is published
  # but ^7.19.0 does not admit it.
  undici: ^7.29.1
  # GHSA-p98j-92pf-mc4p, vulnerable `>= 3.4.13, <= 3.4.15`, fixed in 3.4.16.
  # Arrives via mermaid@11.16.1, which declares `dompurify: ^3.3.3` - a range.
  # Unlike the sibling entry in ai-agent-assembly/cloud, this is NOT an override
  # of an upstream exact pin: there is no monaco-editor here, and the declared
  # range admits the patched version, so it is a plain floor raise.
  dompurify: ^3.4.16
  joi: ^17.13.6
  js-yaml@^4.0.0: ^4.3.2
  js-yaml@3: ^3.15.0
  # Four advisories across the two lines. The 1.x line takes three at three
  # separate fix levels - GHSA-6j4f-fj2g-mc7p (high, < 1.1.19),
  # GHSA-qhr7-859c-m2p7 (high, < 1.1.20) and GHSA-q2hr-2g5m-vwhr (< 1.1.21) -
  # so ^1.1.21 is the single floor that clears all three. The 5.x line takes
  # GHSA-q2hr-2g5m-vwhr (`>= 4.0.0, < 5.0.12`). Both previous floors were stale.
  # These arrive via minimatch 3.1.5 (`brace-expansion: ^1.1.7`) and minimatch
  # 10.2.5 (`^5.0.5`); both ranges admit the patched versions, so both are
  # ordinary floor raises rather than overrides of an upstream pin.
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  launch-editor: ^2.14.1
  # GHSA-253c-mchw-3w2r, vulnerable `< 14.3.1`.
  #
  # This floor was not merely stale, it was inverted: the only dependent is
  # typedoc@0.28.20, which declares `markdown-it: ^14.3.0`, so a ^14.2.0
  # override held the package BELOW its dependent's declared minimum. An
  # override can silently downgrade as well as upgrade, and nothing in the
  # install warns about it - typedoc asked for >= 14.3.0 and got 14.2.0.
  # ^14.3.1 both clears the advisory and puts the resolution back inside the
  # declared range. Kept inside 14.x: markdown-it 15.x is published but
  # ^14.3.0 does not admit it.
  markdown-it: ^14.3.1
  linkify-it: ^5.0.2
  svgo: ^3.3.5
  mermaid: ^11.16.1
  postcss: ^8.5.18
  qs: ^6.16.0
  webpack-dev-server: ^5.2.6
  '@babel/core': ^7.29.6
  uuid: '>=11.1.1'
  websocket-driver: ^0.7.5
  body-parser@1: ^1.20.6
  nanoid: ^3.3.17
  browserslist: ^4.28.7
  postcss-selector-parser@6: ^6.1.3
  postcss-selector-parser@7: ^7.1.3
  '@swc/html': ^1.15.47
  colord: ^2.9.4
  image-size: ^2.0.4
